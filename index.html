<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Snake Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #scoreBoard {
      color: white;
      font-size: 20px;
      padding: 10px;
    }
    #controls {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    select, button {
      padding: 10px 20px;
      font-size: 16px;
    }
    #rankings {
      color: #ccc;
      font-size: 16px;
      margin-top: 10px;
      text-align: center;
    }
    canvas {
      background: #000;
      display: block;
      touch-action: none;
      max-width: 100vw;
      max-height: calc(100vh - 160px);
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

<div id="scoreBoard">Score: 0 | High Score: 0</div>
<div id="controls">
  <select id="skinSelect">
    <option value="classic">Classic (Green / Blue)</option>
    <option value="neon">Neon (Cyan / Magenta)</option>
    <option value="rainbow">Rainbow (Random Colors)</option>
    <option value="secret" disabled>🔒 Secret (10+ pts)</option>
    <option value="ultra" disabled>🔒 Ultra (20+ pts)</option>
  </select>
  <select id="shapeSelect">
    <option value="block">Block (Square)</option>
    <option value="circle">Circle</option>
    <option value="pixel">Pixelated</option>
  </select>
  <button id="startBtn">Start Game</button>
</div>
<canvas id="gameCanvas"></canvas>
<div id="rankings"></div>

<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7cb2c6d609.mp3?filename=8-bit-arcade-115111.mp3" type="audio/mp3" />
</audio>
<audio id="eatSound">
  <source src="https://cdn.pixabay.com/download/audio/2022/02/23/audio_37cf34e3cb.mp3?filename=arcade-notification-111879.mp3" type="audio/mp3" />
</audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreBoard = document.getElementById('scoreBoard');
const startBtn = document.getElementById('startBtn');
const bgm = document.getElementById('bgm');
const eatSound = document.getElementById('eatSound');
const rankingsEl = document.getElementById('rankings');
const skinSelect = document.getElementById('skinSelect');
const shapeSelect = document.getElementById('shapeSelect');

const box = 20;
let cols, rows;
let snake, food, direction, score, highScore, speed, game, obstacles, directionQueue;
let headColor = 'limegreen';
let bodyColor = 'dodgerblue';
let snakeShape = 'block';

function resizeCanvas() {
  const usableWidth = window.innerWidth;
  const usableHeight = window.innerHeight - 160;
  cols = Math.floor(usableWidth / box);
  rows = Math.floor(usableHeight / box);
  canvas.width = cols * box;
  canvas.height = rows * box;
}

function applySkin(skin) {
  if (skin === 'classic') {
    headColor = 'limegreen';
    bodyColor = 'dodgerblue';
  } else if (skin === 'neon') {
    headColor = 'cyan';
    bodyColor = 'magenta';
  } else if (skin === 'rainbow') {
    headColor = randomColor();
    bodyColor = randomColor();
  } else if (skin === 'secret') {
    headColor = '#FFD700';
    bodyColor = '#FF69B4';
  } else if (skin === 'ultra') {
    headColor = '#00FFFF';
    bodyColor = '#FF4500';
  }
}

function randomColor() {
  const colors = ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink'];
  return colors[Math.floor(Math.random() * colors.length)];
}

function randomPosition() {
  return {
    x: Math.floor(Math.random() * cols) * box,
    y: Math.floor(Math.random() * rows) * box
  };
}

function generateObstacles(n = 5) {
  let obs = [];
  while (obs.length < n) {
    let pos = randomPosition();
    if (!snake.some(s => s.x === pos.x && s.y === pos.y) &&
        !(food && food.x === pos.x && food.y === pos.y)) {
      obs.push(pos);
    }
  }
  return obs;
}

function updateScore() {
  highScore = Math.max(score, highScore);
  localStorage.setItem('highScore', highScore);
  scoreBoard.textContent = `Score: ${score} | High Score: ${highScore}`;
  if (score >= 10) skinSelect.querySelector('option[value="secret"]').disabled = false;
  if (score >= 20) skinSelect.querySelector('option[value="ultra"]').disabled = false;
}

function saveRanking(score) {
  let rankings = JSON.parse(localStorage.getItem('rankings') || '[]');
  rankings.push({ score, date: new Date().toLocaleString() });
  rankings.sort((a, b) => b.score - a.score);
  rankings = rankings.slice(0, 5);
  localStorage.setItem('rankings', JSON.stringify(rankings));
}

function showRankings() {
  const rankings = JSON.parse(localStorage.getItem('rankings') || '[]');
  if (rankings.length === 0) return;
  let html = '<strong>Top 5 Rankings</strong><br>';
  rankings.forEach((r, i) => {
    html += `${i + 1}. ${r.score} pts (${r.date})<br>`;
  });
  rankingsEl.innerHTML = html;
}

function startGame() {
  resizeCanvas();
  const selectedSkin = skinSelect.value;
  applySkin(selectedSkin);
  snakeShape = shapeSelect.value;
  snake = [{ x: Math.floor(cols / 2) * box, y: Math.floor(rows / 2) * box }];
  direction = 'RIGHT';
  directionQueue = [];
  food = randomPosition();
  score = 0;
  speed = 130;
  highScore = parseInt(localStorage.getItem('highScore')) || 0;
  obstacles = generateObstacles();
  updateScore();
  rankingsEl.innerHTML = '';
  if (game) clearInterval(game);
  game = setInterval(draw, speed);
  bgm.play();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (directionQueue.length > 0) {
    direction = directionQueue.shift();
  }

  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? headColor : bodyColor;

    if (snakeShape === 'circle') {
      ctx.beginPath();
      ctx.arc(seg.x + box / 2, seg.y + box / 2, box / 2 - 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'white';
      ctx.stroke();
    } else if (snakeShape === 'pixel') {
      ctx.fillRect(seg.x + 2, seg.y + 2, box - 4, box - 4);
      ctx.strokeStyle = 'gray';
      ctx.strokeRect(seg.x + 2, seg.y + 2, box - 4, box - 4);
    } else {
      ctx.fillRect(seg.x, seg.y, box, box);
      ctx.strokeStyle = 'white';
      ctx.strokeRect(seg.x, seg.y, box, box);
    }

    // 👀 이모지 눈 - 머리에만 적용
    if (i === 0) {
      ctx.font = `${box}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('👀', seg.x + box / 2, seg.y + box / 2);
    }
  });

  ctx.fillStyle = 'red';
  ctx.fillRect(food.x, food.y, box, box);

  ctx.fillStyle = 'gray';
  obstacles.forEach(o => ctx.fillRect(o.x, o.y, box, box));

  let headX = snake[0].x;
  let headY = snake[0].y;

  if (direction === 'LEFT') headX -= box;
  else if (direction === 'UP') headY -= box;
  else if (direction === 'RIGHT') headX += box;
  else if (direction === 'DOWN') headY += box;

  if (
    headX < 0 || headX >= canvas.width ||
    headY < 0 || headY >= canvas.height ||
    snake.some(s => s.x === headX && s.y === headY) ||
    obstacles.some(o => o.x === headX && o.y === headY)
  ) {
    clearInterval(game);
    alert(`Game Over!\nScore: ${score}`);
    saveRanking(score);
    showRankings();
    return;
  }

  if (headX === food.x && headY === food.y) {
    score++;
    updateScore();
    eatSound.pause();
    eatSound.currentTime = 0;
    eatSound.play().catch(e => console.log("Sound error:", e));
    food = randomPosition();
    clearInterval(game);
    speed = Math.max(50, speed - 5);
    game = setInterval(draw, speed);
  } else {
    snake.pop();
  }

  snake.unshift({ x: headX, y: headY });
}

function handleDirection(e) {
  const newDir = {
    ArrowLeft: 'LEFT',
    ArrowUp: 'UP',
    ArrowRight: 'RIGHT',
    ArrowDown: 'DOWN'
  }[e.key];
  if (!newDir) return;
  const opposites = { LEFT: 'RIGHT', RIGHT: 'LEFT', UP: 'DOWN', DOWN: 'UP' };
  if (newDir !== opposites[direction]) {
    if (directionQueue[directionQueue.length - 1] !== newDir) {
      directionQueue.push(newDir);
    }
  }
}

let startX, startY;
canvas.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

canvas.addEventListener('touchmove', e => {
  if (!startX || !startY) return;
  const dx = e.touches[0].clientX - startX;
  const dy = e.touches[0].clientY - startY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && direction !== 'LEFT') directionQueue.push('RIGHT');
    else if (dx < 0 && direction !== 'RIGHT') directionQueue.push('LEFT');
  } else {
    if (dy > 0 && direction !== 'UP') directionQueue.push('DOWN');
    else if (dy < 0 && direction !== 'DOWN') directionQueue.push('UP');
  }
  startX = startY = null;
});

document.addEventListener('keydown', handleDirection);
startBtn.addEventListener('click', startGame);
window.addEventListener('resize', () => {
  if (game) {
    clearInterval(game);
    resizeCanvas();
    game = setInterval(draw, speed);
  } else {
    resizeCanvas();
  }
});
</script>

</body>
</html>
